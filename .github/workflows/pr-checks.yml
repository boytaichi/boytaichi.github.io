# Pre-merge release gate for the static site + RPC Worker (Kin PR #1 finding 5; round 2 findings 3, 4; round 3 findings 2, 3).
# Every job checks out the PR HEAD SHA (round 3 finding 2) — not the synthetic refs/pull/N/merge ref — and asserts
# `git rev-parse HEAD` equals it, so the tests and the exact-head preview gate run against the commit under review.
# Runs on every pull request: shared chrome check, copy drift, every page test INCLUDING the headless-Chrome
# integration test (test/site.test.mjs: six pages load with zero console errors, phone-width nav hit-test), and
# the Worker suite (Kin's acceptance tests, the page-manifest replay, limits/bindings/upstream hardening), then the
# exact-head PREVIEW GATE (round 2 finding 3): site/pages served from this exact checkout by a static server, the
# Worker run offline behind a Node shim AND under `wrangler dev --local` (workerd) against a stub upstream, and
# scripts/verify-deploy.mjs run against both with --exact (every served route byte-identical to the checkout).
# No Cloudflare deploy happens here: CI has no token, and the Pages project output dir is Jason's A3 item (DEPLOY.md §2).
# No install step: the site has no dependencies; Google Chrome ships on ubuntu-latest.
name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Pages — chrome, copy drift, unit + browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Kin PR #1 round 3 finding 2: check out the PR HEAD commit, never GitHub's synthetic merge ref (refs/pull/N/merge).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checked-out HEAD is the PR head SHA (round 3 finding 2)
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checked-out HEAD: $HEAD_SHA"
          echo "expected (PR head / github.sha): $EXPECTED_SHA"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chrome available for test/site.test.mjs
        run: google-chrome --version
      - name: Shared nav/footer stamp check
        working-directory: site/pages
        run: node scripts/stamp-chrome.mjs --check
      - name: Copy drift (Site Copy & IA v1)
        working-directory: site/pages
        run: node scripts/copy-drift.mjs
      - name: Page tests (logic, fallback, copy drift, site integration in headless Chrome)
        working-directory: site/pages
        run: node --test token/test/token-logic.test.mjs partners/test/partners-logic.test.mjs shared/test/live-logic.test.mjs shared/test/rpc.test.mjs test/copy-drift.test.mjs test/site.test.mjs
      - name: No unresolved placeholders or forward-looking release promises in the published tree (round 2 finding 4; round 3 finding 3)
        working-directory: site/pages
        run: |
          if grep -rni --include=index.html -E '\[(today|contact address|link pending)[^]]*\]|class="pending"|coming[ -]soon|\bTBD\b|\bTODO\b|lorem ipsum|published with|to be published|when the first partner' . ; then echo "unresolved placeholder or release promise"; exit 1; fi

  worker:
    name: Worker — acceptance, manifest replay, hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Kin PR #1 round 3 finding 2: check out the PR HEAD commit, never GitHub's synthetic merge ref (refs/pull/N/merge).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checked-out HEAD is the PR head SHA (round 3 finding 2)
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checked-out HEAD: $HEAD_SHA"
          echo "expected (PR head / github.sha): $EXPECTED_SHA"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Worker tests
        working-directory: site/worker
        run: node --test test/*.test.mjs
      - name: Wrangler dry run (bundles the shared manifest from site/pages; no deploy, no secrets)
        working-directory: site/worker
        run: npx --yes wrangler@3 deploy --dry-run --outdir /tmp/worker-dry-run

  preview:
    name: Preview gate — exact checkout served + Worker (shim, then wrangler dev --local) + verify-deploy --exact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Kin PR #1 round 3 finding 2: check out the PR HEAD commit, never GitHub's synthetic merge ref (refs/pull/N/merge).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checked-out HEAD is the PR head SHA (round 3 finding 2)
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checked-out HEAD: $HEAD_SHA"
          echo "expected (PR head / github.sha): $EXPECTED_SHA"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline — pages from this checkout (PR head SHA) + Worker handle() behind a Node shim + stub upstream
        working-directory: site/pages
        run: |
          echo "preview gate --exact against checkout $HEAD_SHA"
          node scripts/preview-gate.mjs --worker shim
      - name: workerd — pages from this checkout + `wrangler dev --local` + stub upstream (npx fetches wrangler; no deploy, no token)
        working-directory: site/pages
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          echo "preview gate --exact against checkout $HEAD_SHA"
          node scripts/preview-gate.mjs --worker wrangler --wrangler-timeout-ms 240000

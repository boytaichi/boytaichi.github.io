name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Static site (site/pages): no build step, no npm install. See site/DEPLOY.md. Same gate as pr-checks.yml (Kin PR #1 finding 5).
      - name: Check shared nav/footer, copy drift, every page test (incl. headless-Chrome site.test.mjs)
        working-directory: site/pages
        run: |
          node scripts/stamp-chrome.mjs --check
          node scripts/copy-drift.mjs
          node --test token/test/token-logic.test.mjs partners/test/partners-logic.test.mjs shared/test/live-logic.test.mjs shared/test/rpc.test.mjs test/copy-drift.test.mjs test/site.test.mjs
      - name: Worker tests (acceptance, page-manifest replay, hardening)
        working-directory: site/worker
        run: node --test test/*.test.mjs
      - name: Assemble Pages artifact (pages tree without tests/scripts; CNAME kept)
        run: |
          rsync -a --exclude 'test/' --exclude 'scripts/' --exclude 'README.md' site/pages/ dist/
          cp public/CNAME dist/CNAME
          find dist -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
